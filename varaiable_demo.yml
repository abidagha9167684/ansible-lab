---
- name: Software Management with Variables
  hosts: Client2
  become: true

  vars:
    package_name: nginx
    service_name: nginx

  tasks:
    - name: Install software
      apt:
        name: "{{ package_name }}"
        state: present
        update_cache: yes

    - name: Start and enable service
      service:
        name: "{{ service_name }}"
        state: started
        enabled: yes

    - name: Deploy web page
      template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
      notify: Restart Nginx
  handlers: 
    - name: Restart Nginx
      service:
        name: "{{ service_name}}"
        state: restarted
