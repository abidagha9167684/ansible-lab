---

- name: Configure Nginx on Linux Clients
  hosts: Client2
  become: true

  vars:
      package_name: nginx
      service_name: nginx

  tasks:
      - name: Update apt cache
        apt:
          update_cache: yes

      - name: Install Nginx
        apt:
          name: "{{ package_name }}"
          state: present

      - name: Start and Enable Nginx
        service:
          name: "{{ service_name }}"
          state: started
          enabled: yes

      - name: Stop the Nginx
        service:
          name: nginx
          state: stopped
